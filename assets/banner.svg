<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.12" />
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Subtle Blueprint Subgrid -->
    <pattern id="blueprintGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#archGrid)" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-rect { fill: url(#bgGrad); }
    .grid-layer { fill: url(#blueprintGrid); }
    
    /* Animated pulsing light spheres */
    .orb-1 {
      animation: pulseOrb1 7s ease-in-out infinite alternate;
    }
    .orb-2 {
      animation: pulseOrb2 9s ease-in-out infinite alternate;
    }
    @keyframes pulseOrb1 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.35; }
      100% { transform: translate(60px, 30px) scale(1.25); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      100% { transform: translate(-50px, -20px) scale(1.2); opacity: 0.55; }
    }

    /* Animated scanning line */
    .scan-line {
      stroke: #38bdf8;
      stroke-width: 1.5;
      stroke-dasharray: 6 6;
      opacity: 0.4;
      animation: scanAnim 8s linear infinite;
    }
    @keyframes scanAnim {
      0% { transform: translateY(0); opacity: 0.1; }
      50% { opacity: 0.45; }
      100% { transform: translateY(420px); opacity: 0.1; }
    }

    /* Dynamic Drafting vectors */
    .draft-line {
      stroke: #38bdf8;
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: drawCad 6s ease-in-out infinite alternate;
    }
    @keyframes drawCad {
      0% { stroke-dashoffset: 200; opacity: 0.2; }
      50% { stroke-dashoffset: 0; opacity: 0.8; }
      100% { stroke-dashoffset: 0; opacity: 0.8; }
    }

    .badge-pill {
      fill: rgba(30, 41, 59, 0.75);
      stroke: rgba(56, 189, 248, 0.4);
      stroke-width: 1;
      rx: 16;
    }
  </style>

  <!-- Background Base -->
  <rect class="bg-rect" width="1200" height="420" />

  <!-- Glowing background ambient orbs -->
  <g filter="url(#softGlow)">
    <circle class="orb-1" cx="150" cy="100" r="140" fill="#0284c7" />
    <circle class="orb-2" cx="1050" cy="300" r="160" fill="#7c3aed" />
    <circle cx="600" cy="50" r="120" fill="#0d9488" opacity="0.2" />
  </g>

  <!-- Blueprint & CAD Grid Layer -->
  <rect class="grid-layer" width="1200" height="420" />

  <!-- Animated Scanner Laser -->
  <line class="scan-line" x1="0" y1="0" x2="1200" y2="0" />

  <!-- Background Architectural CAD Floor Plan Silhouette Graphic (Right Side) -->
  <g opacity="0.32" transform="translate(820, 40)">
    <!-- Outer perimeter walls -->
    <rect x="0" y="0" width="320" height="300" fill="none" stroke="#38bdf8" stroke-width="3" />
    <!-- Interior partitions -->
    <line x1="120" y1="0" x2="120" y2="300" stroke="#818cf8" stroke-width="2" />
    <line x1="120" y1="140" x2="320" y2="140" stroke="#818cf8" stroke-width="2" />
    <line x1="0" y1="180" x2="120" y2="180" stroke="#818cf8" stroke-width="2" />
    <!-- Door swing arcs -->
    <path d="M 120 180 A 40 40 0 0 1 160 220" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="120" y1="180" x2="120" y2="220" stroke="#38bdf8" stroke-width="2" />
    <path d="M 120 60 A 35 35 0 0 0 85 95" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="120" y1="60" x2="85" y2="60" stroke="#38bdf8" stroke-width="2" />
    <!-- Dimension lines -->
    <line x1="0" y1="-15" x2="320" y2="-15" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="-20" x2="0" y2="-10" stroke="#94a3b8" stroke-width="1" />
    <line x1="320" y1="-20" x2="320" y2="-10" stroke="#94a3b8" stroke-width="1" />
    <text x="140" y="-22" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">12,800 mm</text>
    <!-- Room tags -->
    <text x="35" y="90" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" opacity="0.8">LIVING</text>
    <text x="35" y="240" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" opacity="0.8">KITCHEN</text>
    <text x="180" y="70" fill="#818cf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" opacity="0.8">MASTER BED</text>
    <text x="180" y="220" fill="#818cf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" opacity="0.8">STUDIO / BIM</text>
  </g>

  <!-- Animated dynamic CAD drafting strokes -->
  <g transform="translate(60, 40)">
    <path class="draft-line" d="M 0 320 L 40 280 L 120 280 L 160 320" />
    <circle cx="40" cy="280" r="3" fill="#38bdf8" />
    <circle cx="120" cy="280" r="3" fill="#818cf8" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Taglines, Feature Badges (Always in foreground) -->
  <g transform="translate(80, 0)">
    <!-- Category Mini-Pill -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" filter="url(#glow)" />
      <text x="32" y="21" fill="#38bdf8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" fill="#f8fafc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Architectural Design &amp;
    </text>
    <text x="0" y="205" fill="url(#primaryGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      Floor Plan Software
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="250" fill="#94a3b8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="18" font-weight="400">
      The definitive index of 2D/3D floor planners, parametric CAD, BIM engines &amp; interior modeling platforms
    </text>

    <!-- Interactive / Feature Pills Bar -->
    <g transform="translate(0, 285)">
      <!-- Pill 1: 2D & 3D CAD Drafting -->
      <g transform="translate(0, 0)">
        <rect class="badge-pill" width="160" height="34" />
        <text x="18" y="22" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">📐 2D/3D CAD</text>
      </g>
      <!-- Pill 2: Open BIM & IFC -->
      <g transform="translate(172, 0)">
        <rect class="badge-pill" width="165" height="34" />
        <text x="18" y="22" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">🏢 BIM &amp; IFC Open</text>
      </g>
      <!-- Pill 3: Interior Floor Plans -->
      <g transform="translate(349, 0)">
        <rect class="badge-pill" width="175" height="34" />
        <text x="18" y="22" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">🛋️ Space Planning</text>
      </g>
      <!-- Pill 4: Cloud SaaS & AI -->
      <g transform="translate(536, 0)">
        <rect class="badge-pill" width="180" height="34" />
        <text x="18" y="22" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">⚡ Cloud SaaS &amp; AI</text>
      </g>
    </g>

    <!-- Metrics/Footer Tagline -->
    <text x="0" y="365" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="500">
      Curated with open-source repositories &#8226; Verified pricing models &#8226; Free tier benchmarks
    </text>
  </g>
</svg>
